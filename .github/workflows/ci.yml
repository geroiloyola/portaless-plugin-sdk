name: Plugin SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-sdk:
    name: Build, Tests, License & Tarball Smoke (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build dist/ (ESM .js + .d.ts)
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Verify MIT license metadata and LICENSE file
        run: npm run verify:license

      - name: Pack and consume tarball in isolated project (runtime + tsc --noEmit)
        run: npm run smoke:tarball
